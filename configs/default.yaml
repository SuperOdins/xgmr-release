# Moved to train block
device: cuda
cudnn_benchmark: true
model:
  backbone:
    name: light
    base_dim: 32
    depth: 3
  mba:
    in_ch_rgb: 3
    in_ch_t: 1
    out_dim: 64
    use_eaef: true
  matcher:
    dim: 64
    layers: [2, 1]
    temp: 0.05
    strip_width: 5
    n_fine_matches: 512
    num_heads: 4
    pe_max_shape: [256, 256]
    pe_temp: 10000.0
    bias_strength: 2.0
  selfcalib:
    dim: 64
    tps_grid: 5
    iters: 1
    match_k: 128
    match_dim: 128
    h_res_scale: 1e-4
    tps_res_scale: 0.02
  qfusion:
    tile: 32
    k: 8.0
    tau: 0.5
    num_matches_scale: 100.0
  use_mba: true
  use_self_calib: true
  use_qfusion: true
data:
  rgb_dir: ./data/rgb
  thermal_dir: ./data/thermal
  batch_size: 32
  num_workers: 8
  img_size: [480, 640]
train:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  grad_clip: 0.5
  warmup_epochs: 5
  transition_epochs: 10
  seed: 2025
loss:
  lambda_q: 0.1
  lambda_eq: 5.0
  lambda_geo: 5.0
  lambda_ent: 0.01
  lambda_det: 5.0
  lambda_identity: 0.1
  lambda_direct: 1.0
  lambda_direct_warmup: 20.0
selfsup:
  geom:
    h_bounds_px: [0.0, 60.0]
    rot_deg: [-15.0, 15.0]
    scale: [0.8, 1.2]
  augment:
    weak_color: true
    strong_color: true
    noise_blur: true
  bias_sigma_px: 4.0

